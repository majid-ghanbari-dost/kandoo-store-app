name: Build Kandoo Store (Windows + Android)

# Builds the .NET MAUI app on GitHub-hosted runners. No self-hosted runners.
# PM-03 facts from the old Kandoo repo (docs/PM_LOG.md), applied here by hand:
# - windows-latest default `dotnet` is SDK 11; the SDK 8 pin lives ONLY in
#   src/KandooStore.App/global.json (8.0.100, rollForward latestFeature).
# - MAUI steps run with working-directory: src/KandooStore.App.
# - Windows workload is `maui-windows` (not `maui`).
# - The Windows-only target is selected with -p:KandooWindowsOnly=true
#   (never the plural -p:TargetFrameworks).
# This workflow is the verification step for the hand-written code:
# dotnet is NOT available in the author's VM, so CI is where the build is proven.
# The Android emulator smoke job is best-effort only (continue-on-error):
# GitHub-hosted ubuntu-latest runners have no KVM, so the emulator cannot boot
# there; it must never be presented as a PASS. See docs/MERGE-NOTES-FA.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build-windows:
    name: Windows (win-x64, self-contained)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/KandooStore.App
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Show SDK (pin check)
        run: |
          dotnet --version
          dotnet --list-sdks
      - name: Install MAUI Windows workload
        run: |
          dotnet workload install maui-windows
          if ($LASTEXITCODE -ne 0) { throw "maui-windows workload install failed." }
      - name: Publish Windows (Release, win-x64, self-contained)
        run: |
          dotnet publish KandooStore.App.csproj -c Release -f net8.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:KandooWindowsOnly=true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=true -o "$env:GITHUB_WORKSPACE/artifacts/kandoo-windows-x64" "-bl:$env:GITHUB_WORKSPACE/artifacts/maui-publish.binlog" -v:m
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: kandoo-windows-x64
          path: artifacts/kandoo-windows-x64
          if-no-files-found: error
      - name: Upload MAUI build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kandoo-maui-publish-binlog
          path: artifacts/maui-publish.binlog
          if-no-files-found: warn

  build-android:
    name: Android (APK)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/KandooStore.App
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Setup Java 17 (required by MAUI Android)
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Publish Android APK (Release)
        run: dotnet publish KandooStore.App.csproj -c Release -f net8.0-android -p:AndroidPackageFormat=apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kandoo-android-apk
          path: src/KandooStore.App/bin/Release/net8.0-android/publish/*.apk
          if-no-files-found: error

  android-emulator-smoke:
    name: Android 10 emulator launch + 15s liveness (best-effort)
    runs-on: ubuntu-latest
    needs: build-android
    timeout-minutes: 35
    continue-on-error: true
    # Best-effort only: GitHub-hosted ubuntu-latest has no KVM, so the Android 10
    # emulator cannot boot there. This job must never be reported as PASS.
    # First verbatim error, if any, is the evidence — not the job conclusion.
    steps:
      - uses: actions/checkout@v4
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: kandoo-android-apk
          path: artifacts
      - name: Launch on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: echo "APK built; emulator liveness check is best-effort only (no KVM on GitHub-hosted runners)."
