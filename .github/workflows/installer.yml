name: Windows installer (Kandoo-Setup-x64.exe)

# Builds the Inno Setup installer for the MAUI Windows app.
# Layout target (PM-04, installer layout v2): {app}\app\KandooStore.App.exe
# with its own self-contained runtime. The Hub ({app}\hub\Kandoo.Hub.exe)
# is a separate component and is NOT in this repo — see
# packaging/HubPilot/BUILD-INSTALLER.md. This installer is PARTIAL until it
# is tested on a real Windows machine by the owner (R-01 in the handoff).
# Hand-written for this repo; not a copy of the old workflow.

on:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "src/KandooStore.App/**"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build-installer:
    name: Inno Setup installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish Windows app for installer
        working-directory: src/KandooStore.App
        run: |
          dotnet workload install maui-windows
          dotnet publish KandooStore.App.csproj -c Release -f net8.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:KandooWindowsOnly=true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -o "$env:GITHUB_WORKSPACE/packaging/HubPilot/publish/app"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        working-directory: packaging/HubPilot
        run: iscc KandooHub.Installer.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: kandoo-setup-x64
          path: packaging/HubPilot/Output/Kandoo-Setup-x64.exe
          if-no-files-found: error
